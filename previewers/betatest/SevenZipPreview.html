<html>

<head>
    <meta charset="utf-8">
    <title class="sevenZipPreviewText">7zip Preview</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"
            integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.fancytree@2.38.1/dist/jquery.fancytree-all-deps.min.js"
            integrity="sha256-xDmafpv2lpjQOfcPY5h1L6WHfxr85D+KOXsvK00LZXI=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.fancytree@2.38.1/dist/modules/jquery.fancytree.table.js"

    <script src="lib/jquery.i18n.js"></script>
    <script src="lib/jquery.i18n.messagestore.js"></script>
    <script src="lib/jquery.i18n.language.js"></script>
    <script type="text/javascript" src="js/retriever.js"></script>
    <script type="module" src="js/sevenzip.js"></script>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
          integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap-theme.min.css"

          integrity="sha256-j1K2dTzrtUddJ5Rzflbn5ucx5g7lAxErYOzLhxaKYIY=" crossorigin="anonymous">
    <link type="text/css" rel="stylesheet" href="css/preview.css" />

    <style type="text/css">
        table.fancytree-ext-table tbody tr:nth-child(even) {
            background-color: #f4f4f8;
        }

        table.fancytree-ext-table {
            width: 80%;
        }

        td.alignCenter {
            text-align: center;
        }

        td.alignRight {
            text-align: right;
        }

        .fancytree-title {
            cursor: auto !important;
        }
    </style>

</head>

<body class="container">
    <main>
        <img id='logo' alt='Site Logo'>
        <h1 class="page-title sevenZipPreviewText">7zip Preview</h1>
        <div class='preview-container'>
            <div class='preview-header'></div>
            <div class="">
                This preview shows the archive structure only. To download the complete zip file, please use the <b>Access File</b> button above.
            </div>
            <div id='sevenzip-preview' class='preview'>
                <img id="throbber" src="images/three-dots.svg" style="display:block; margin: auto; width: 15%;" />

                <table id="treegrid">
                    <colgroup>
                        <col width="*"></col>
                        <col width="100px"></col>
                    </colgroup>
                    <tbody>
                        <tr>
                            <td></td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>

    </main>
</body>

</html>
